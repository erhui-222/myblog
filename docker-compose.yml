services:
  db:
    image: postgres:17-alpine
    container_name: myblog-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: myblog
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: myblog-app
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内网走服务名，覆盖 .env 里给本地开发用的 localhost:5433
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/myblog?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/myblog?schema=public
      TZ: Asia/Shanghai
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: myblog-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
