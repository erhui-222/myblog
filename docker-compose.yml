services:
  app:
    build: .
    container_name: myblog-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/blog.db
      TZ: Asia/Shanghai
      NODE_ENV: production
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: myblog-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
