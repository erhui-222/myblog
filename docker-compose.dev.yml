# 本地开发用的 Postgres，与生产（Vercel Marketplace 的 Neon）同构
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    container_name: myblog-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: myblog
      TZ: Asia/Shanghai
    ports:
      # 用 5433 避免和本机已有 Postgres 冲突
      - "5433:5432"
    volumes:
      - myblog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myblog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  myblog-pgdata:
